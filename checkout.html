
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ShopStream</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>

    <!-- Navigation -->
    <header class="navbar">
        <a href="home.html" class="logo">Shop<span>Stream</span></a>

        <nav>
            <a href="home.html">Home</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main class="checkout-container">

        <h1>Checkout</h1>
        <p class="subtitle">Enter your details to complete your order.</p>

        <div class="checkout-layout">

            <!-- Customer Information -->
            <section class="checkout-form">
                <h2>Delivery Information</h2>

                <form id="checkout-form">

                    <label for="customer-name">Full Name</label>
                    <input type="text" id="customer-name"
                        placeholder="Enter your full name" required>

                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone"
                        placeholder="03XXXXXXXXX"
                        pattern="03[0-9]{9}"
                        title="Enter a 11-digit Pakistani mobile number starting with 03"
                        required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email"
                        placeholder="Enter your email" required>

                    <label for="address">Delivery Address</label>
                    <textarea id="address"
                        placeholder="Enter your complete delivery address"
                        rows="4" required></textarea>

                    <label for="city">City</label>
                    <input type="text" id="city"
                        placeholder="Enter your city" required>

                    <h2 class="payment-heading">Payment Method</h2>

                    <label class="payment-option">
                        <input type="radio" name="payment"
                            value="Cash on Delivery" checked>
                        Cash on Delivery (COD)
                    </label>

                    <button type="submit" id="place-order">
                        Place Order
                    </button>

                </form>
            </section>

            <!-- Order Summary -->
            <aside class="order-summary">
                <h2>Your Order</h2>

                <div id="checkout-products">
                    <!-- Products appear here -->
                </div>

                <hr>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">Rs. 0</span>
                </div>

                <div class="summary-row">
                    <span>Delivery</span>
                    <span>Free</span>
                </div>

                <hr>

                <div class="summary-row total-row">
                    <strong>Total</strong>
                    <strong id="total">Rs. 0</strong>
                </div>
            </aside>

        </div>

        <div id="order-message" class="order-message" hidden></div>

    </main>

    <footer class="footer">
        <h2>ShopStream</h2>
        <p>Your everyday shopping destination.</p>
        <p>© 2026 ShopStream. All rights reserved.</p>
    </footer>

    <script src="checkout.js"></script>
</body>
</html>
